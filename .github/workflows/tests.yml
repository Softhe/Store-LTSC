name: Installer regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated installer tests
        shell: ${{ matrix.shell }}
        run: ./tests/Run-Tests.ps1

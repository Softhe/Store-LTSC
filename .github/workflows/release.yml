# Publishes a GitHub release when a version tag (v1.2.3) is pushed. The tag must match $StoreLtscVersion in
# install.ps1 and have a dated section in CHANGELOG.md. The assets are the repository's own bytes (published from
# Linux, so no line-ending conversion), so their SHA-256 also matches the pinned raw.githubusercontent.com URL.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        engine: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated installer tests
        shell: pwsh
        run: |
          & '${{ matrix.engine }}.exe' -NoProfile -NonInteractive -File ./tests/Run-Tests.ps1
          exit $LASTEXITCODE

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the version and write the release notes
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $text = Get-Content -LiteralPath install.ps1 -Raw
          if ($text -notmatch "\`$StoreLtscVersion = '(?<v>[^']+)'") { throw 'install.ps1 does not declare $StoreLtscVersion' }
          $version = $Matches.v
          if ("v$version" -ne $tag) { throw "Tag $tag does not match install.ps1 version $version" }

          $changelog = Get-Content -LiteralPath CHANGELOG.md -Raw
          if ($changelog -notmatch "(?ms)^## \[$([regex]::Escape($version))\](?<head>[^\r\n]*)\r?\n(?<body>.*?)(?=^## \[|\z)") { throw "CHANGELOG.md has no section for $version" }
          if ($Matches.head -match 'Unreleased') { throw "Date the CHANGELOG.md section for $version before tagging it" }
          $notes = $Matches.body.Trim()

          $hashes = foreach ($file in 'install.ps1', 'Install-Store.cmd') { '{0}  {1}' -f (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant(), $file }
          [IO.File]::WriteAllText("$PWD/SHA256SUMS.txt", (($hashes -join "`n") + "`n"))
          $repo = '${{ github.repository }}'
          $lines = @(
            $notes, '',
            '### Run this version', '',
            '```powershell',
            "irm https://raw.githubusercontent.com/$repo/$tag/install.ps1 | iex",
            '```', '',
            '### SHA-256', '',
            '```'
          ) + $hashes + @('```')
          [IO.File]::WriteAllText("$PWD/release-notes.md", ($lines -join "`n"))

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' install.ps1 Install-Store.cmd SHA256SUMS.txt \
            --title "Store-LTSC ${{ github.ref_name }}" --notes-file release-notes.md --verify-tag
